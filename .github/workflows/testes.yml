# Roda os testes automatizados no GitHub a cada push e pull request para a main.
# O resultado aparece como ✔ / ✖ ao lado de cada commit e na aba Actions do repositório.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (xUnit)
    runs-on: ubuntu-latest

    # Um MySQL 8 só para os testes: criado do zero nesta máquina temporária e apagado no fim.
    # A senha abaixo é só deste MySQL descartável; a senha de verdade nunca vem para o GitHub.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: senha_de_teste_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psenha_de_teste_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Os testes trocam o nome do banco por "controle_financeiro_testes" (veja ApiDeTeste.cs).
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=controle_financeiro;User=root;Password=senha_de_teste_ci
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Rodar os testes da API
        working-directory: tests/ControleFinanceiro.Tests
        run: dotnet test --logger "console;verbosity=normal"

  frontend:
    name: Front-end (lint, Vitest e build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes do front-end
        run: npm test

      - name: Build
        run: npm run build
